      <!-- otp -->

      <script>
         $(document).ready(function () {
            // When a key is pressed in OTP input
            $('.otp-value input').on('keyup', function (e) {
               const input = $(this);
               const value = input.val();
               const nextId = input.data('next');
               const prevId = input.data('previous');

               // Allow only 1 digit and auto move
               if (value.length === 1 && nextId) {
                  $('#' + nextId).focus();
               }

               // If backspace and empty, go to previous input
               if (e.key === 'Backspace' && !value && prevId) {
                  $('#' + prevId).focus();
               }

               // Limit to 1 digit only
               if (value.length > 1) {
                  input.val(value.slice(0, 1));
               }
            });

            // Prevent scroll on number input
            $('input[type=number]').on('wheel', function (e) {
               $(this).blur();
            });
         });
      </script>
