  <script>
    $(document).ready(function () {

      // 🕒 Update Date & Time
      function updateDateTime() {
        const now = new Date();

        // Format date as DD-MM-YYYY
        const date = now.toLocaleDateString('ta-IN', {
          day: '2-digit', month: '2-digit', year: 'numeric'
        });

        // Format time as HH:MM:SS
        const time = now.toLocaleTimeString('ta-IN', {
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });

        $('#showdate').text(date);
        $('#showTime').text(time);
      }

      // Run immediately & then every second
      updateDateTime();
      setInterval(updateDateTime, 1000);

      // 📍 Get User Location
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (position) {
            $('#user_lat').text(`Lat: ${position.coords.latitude.toFixed(4)}`);
            $('#user_long').text(`Long: ${position.coords.longitude.toFixed(4)}`);
            $('#accuracy').text(`±${position.coords.accuracy.toFixed(0)}m`);
          },
          function (error) {
            $('#user_lat').text('Lat: N/A');
            $('#user_long').text('Long: N/A');
            $('#accuracy').text('');
            console.error('Location Error:', error.message);
          },
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      } else {
        $('#user_lat').text('GPS Not Supported');
      }

    });
  </script>
  <!-- date,time,lat,lon -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const entryType = document.getElementById("entryType");
      const manualOptions = document.getElementById("manualOptions");
      const withCard = document.getElementById("withCard");
      const withoutCard = document.getElementById("withoutCard");
      const rationCardSection = document.getElementById("rationCardSection");
      const verifyUfcBtn = document.getElementById("verifyUfcBtn");
      const ufcInput = document.getElementById("ufcInput");
      const ufcSuccessMsg = document.getElementById("ufcSuccessMsg");

      // Step 1: Handle main dropdown
      entryType.addEventListener("change", () => {
        const selected = entryType.value;
        if (selected === "shopwise") {
          // Navigate directly
          window.location.href = "details.html";
        } else if (selected === "manual") {
          manualOptions.style.display = "block";
          rationCardSection.style.display = "none";
        }
      });

      // Step 2: Manual type selection
      withCard.addEventListener("change", () => {
        rationCardSection.style.display = "block";
        ufcSuccessMsg.style.display = "none";
      });

      withoutCard.addEventListener("change", () => {
        rationCardSection.style.display = "none";
        window.location.href = "details-new.html";
      });

      // Step 3: Verify UFC number and navigate
      verifyUfcBtn.addEventListener("click", () => {
        const ufcValue = ufcInput.value.trim();

        if (ufcValue.length < 6) {
          alert("சரியான UFC எண்ணை உள்ளிடவும்.");
          return;
        }

        // Show success message
        ufcSuccessMsg.style.display = "block";

        // Simulate verification + navigation delay
        setTimeout(() => {
          window.location.href = "details.html";
        }, 1200);
      });
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const entryType = document.getElementById("entryType");
      const manualOptions = document.getElementById("manualOptions");
      const rationCardSection = document.getElementById("rationCardSection");
      const verifyBtn = document.getElementById("verifyBtn");
      const ufcInput = document.getElementById("ufcInput");
      const errorMsg = document.getElementById("ufcErrorMsg");
      const successMsg = document.getElementById("ufcSuccessMsg");

      // ✅ Always reset fields on load or when navigating back
      window.addEventListener("pageshow", function (event) {
        if (event.persisted || performance.navigation.type === 2) {
          resetFormFields();
        } else {
          resetFormFields();
        }
      });

      function resetFormFields() {
        entryType.value = "தேர்வு செய்யவும்...";
        manualOptions.style.display = "none";
        rationCardSection.style.display = "none";
        document.querySelectorAll('input[name="manualType"]').forEach(el => el.checked = false);
        ufcInput.value = "";
        errorMsg.style.display = "none";
        successMsg.style.display = "none";
      }

      // 🔹 Handle entry mode selection
      entryType.addEventListener("change", function () {
        if (this.value === "manual") {
          manualOptions.style.display = "block";
        } else {
          manualOptions.style.display = "none";
          rationCardSection.style.display = "none";
        }
      });

      // 🔹 Show ration card section when "withCard" selected
      document.getElementById("withCard").addEventListener("change", () => {
        rationCardSection.style.display = "block";
      });

      // 🔹 Hide ration card section when "withoutCard" selected
      document.getElementById("withoutCard").addEventListener("change", () => {
        rationCardSection.style.display = "none";
      });

      // 🔹 Verify button click
      verifyBtn.addEventListener("click", function () {
        const ufcValue = ufcInput.value.trim();

        // ✅ Validate 12-digit number
        if (!/^\d{12}$/.test(ufcValue)) {
          errorMsg.style.display = "block";
          successMsg.style.display = "none";
          ufcInput.classList.add("is-invalid");
          return;
        }

        // ✅ Success UI
        errorMsg.style.display = "none";
        ufcInput.classList.remove("is-invalid");
        successMsg.style.display = "block";

        // ✅ Toast setup
        const ackMessage = document.getElementById("ackMessage");
        ackMessage.innerHTML = `
        <i class="bi bi-check-circle-fill me-1"></i>
        <strong>UFC Verified Successfully!</strong><br/>
      `;

        const toastEl = document.getElementById("ackToast");
        const toast = new bootstrap.Toast(toastEl, { delay: 2000 });
        toast.show();

        // ✅ Navigate after 1 second
        setTimeout(() => {
          window.location.href = 'withoutration.html';
        }, 1000);
      });
    });
  </script>
