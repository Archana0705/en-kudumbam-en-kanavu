      <!-- otp -->
      <script>
         // Enable Agree button only after consent is checked
         document.getElementById("consentCheck").addEventListener("change", function () {
            const agreeBtn = document.getElementById("agreeBtn");
            if (this.checked) {
               agreeBtn.classList.remove("disabled");
               agreeBtn.style.opacity = "1";
               agreeBtn.style.pointerEvents = "auto";
            } else {
               agreeBtn.classList.add("disabled");
               agreeBtn.style.opacity = "0.6";
               agreeBtn.style.pointerEvents = "none";
            }
         });
      </script>

      <script>
         $(document).ready(function () {
            // When a key is pressed in OTP input
            $('.otp-value input').on('keyup', function (e) {
               const input = $(this);
               const value = input.val();
               const nextId = input.data('next');
               const prevId = input.data('previous');

               // Allow only 1 digit and auto move
               if (value.length === 1 && nextId) {
                  $('#' + nextId).focus();
               }

               // If backspace and empty, go to previous input
               if (e.key === 'Backspace' && !value && prevId) {
                  $('#' + prevId).focus();
               }

               // Limit to 1 digit only
               if (value.length > 1) {
                  input.val(value.slice(0, 1));
               }
            });

            // Prevent scroll on number input
            $('input[type=number]').on('wheel', function (e) {
               $(this).blur();
            });
         });
      </script>
